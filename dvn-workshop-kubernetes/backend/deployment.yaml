apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-backend
  namespace: default
  labels:
    app.kubernetes.io/name: youtube-backend
    app.kubernetes.io/instance: youtube-backend-prod
    app.kubernetes.io/version: v1.0.0
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: dvn-workshop
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: youtube-backend
      app.kubernetes.io/instance: youtube-backend-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: youtube-backend
        app.kubernetes.io/instance: youtube-backend-prod
        app.kubernetes.io/version: v1.0.0
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: dvn-workshop
    spec:
      containers:
      - name: backend
        image: 910661159891.dkr.ecr.us-east-1.amazonaws.com/dvn-workshop/backend:latest
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: YOUTUBE_API_KEY
          value: "YOUR_YOUTUBE_API_KEY_HERE"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /backend/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /backend/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
