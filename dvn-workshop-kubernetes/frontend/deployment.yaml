apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-frontend
  namespace: default
  labels:
    app.kubernetes.io/name: youtube-frontend
    app.kubernetes.io/instance: youtube-frontend-prod
    app.kubernetes.io/version: v1.0.0
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: dvn-workshop
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: youtube-frontend
      app.kubernetes.io/instance: youtube-frontend-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: youtube-frontend
        app.kubernetes.io/instance: youtube-frontend-prod
        app.kubernetes.io/version: v1.0.0
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: dvn-workshop
    spec:
      containers:
      - name: frontend
        image: 910661159891.dkr.ecr.us-east-1.amazonaws.com/dvn-workshop/frontend:latest
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
